<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up — TurfBook</title>
    
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Header / Navbar Container -->
    <div id="main-navbar-container"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
                    <!-- Tab Switcher -->
                    <div class="p-3 bg-light border-bottom d-flex gap-2">
                        <button class="btn btn-sm w-100 fw-bold active" id="tab-login-btn" onclick="switchAuthTab('login')">
                            Sign In
                        </button>
                        <button class="btn btn-sm w-100 fw-bold" id="tab-register-btn" onclick="switchAuthTab('register')">
                            Create Account
                        </button>
                    </div>

                    <!-- LOGIN SECTION -->
                    <div class="p-4" id="login-card-section">
                        <div class="text-center mb-4">
                            <h4 class="fw-extrabold text-secondary mb-1">Welcome Back 👋</h4>
                            <p class="text-muted small">Enter your email and password to book your turf</p>
                        </div>

                        <form id="user-login-form">
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Email Address</label>
                                <input type="email" id="login-email" class="form-control" placeholder="user@turfbook.com" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-bold text-muted">Password</label>
                                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="btn btn-primary-turf w-100 py-2 fw-bold mb-3">
                                Sign In
                            </button>
                        </form>

                        <!-- Demo Fill Helper -->
                        <div class="p-3 bg-light rounded-3 text-center small border">
                            <span class="text-muted d-block mb-1">Testing Demo Credentials:</span>
                            <button type="button" class="btn btn-sm btn-outline-secondary py-0" 
                                    onclick="fillDemoUser('user@turfbook.com', 'user123')">
                                Quick Fill: Demo User
                            </button>
                        </div>
                    </div>

                    <!-- REGISTER SECTION -->
                    <div class="p-4 d-none" id="register-card-section">
                        <div class="text-center mb-4">
                            <h4 class="fw-extrabold text-secondary mb-1">Create Account 🚀</h4>
                            <p class="text-muted small">Join thousands of players booking grounds everyday</p>
                        </div>

                        <form id="user-register-form">
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Full Name</label>
                                <input type="text" id="reg-name" class="form-control" placeholder="e.g. Rahul Sharma" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Email Address</label>
                                <input type="email" id="reg-email" class="form-control" placeholder="yourname@gmail.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Phone Number</label>
                                <input type="tel" id="reg-phone" class="form-control" placeholder="+91 9876543210" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">Password (min 6 chars)</label>
                                <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6">
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-bold text-muted">Confirm Password</label>
                                <input type="password" id="reg-confirm-password" class="form-control" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="btn btn-primary-turf w-100 py-2 fw-bold">
                                Create Account & Sign In
                            </button>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-3 small text-muted">
                    Looking for admin access? <a href="admin-login.html" class="text-decoration-none">Admin Login</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- TurfBook Scripts -->
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ai.js"></script>

    <script>
        function fillDemoUser(email, pass) {
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = pass;
        }
    </script>
</body>
</html>
