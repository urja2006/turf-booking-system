<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal — TurfBook</title>
    
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-secondary shadow-lg rounded-4 p-4 bg-secondary-light text-white">
                    <div class="text-center mb-4">
                        <div class="badge bg-danger px-3 py-2 fs-6 mb-3">
                            <i class="bi bi-shield-lock-fill me-1"></i> ADMIN PORTAL
                        </div>
                        <h4 class="fw-bold text-white mb-1">TurfBook Management</h4>
                        <p class="text-white-50 small">Sign in with administrator credentials</p>
                    </div>

                    <form id="admin-login-form">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-white-50">Admin Email</label>
                            <input type="email" id="admin-email" class="form-control bg-dark text-white border-secondary" 
                                   value="admin@turfbook.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-white-50">Admin Password</label>
                            <input type="password" id="admin-password" class="form-control bg-dark text-white border-secondary" 
                                   value="admin123" required>
                        </div>
                        <button type="submit" class="btn btn-primary-turf w-100 py-2 fw-bold mb-3">
                            Access Admin Dashboard
                        </button>
                    </form>

                    <!-- Demo Credentials Note -->
                    <div class="p-3 bg-dark bg-opacity-50 border border-secondary rounded-3 text-center small text-white-50">
                        Demo Admin: <code>admin@turfbook.com</code> / <code>admin123</code>
                    </div>

                    <div class="text-center mt-3 small">
                        <a href="index.html" class="text-white-50 text-decoration-none">← Back to Player Website</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- TurfBook Scripts -->
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
