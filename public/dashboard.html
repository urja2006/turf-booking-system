<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard — TurfBook</title>
    
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Navbar Container -->
    <div id="main-navbar-container"></div>

    <div class="container py-4">
        <!-- User Profile Banner -->
        <div class="card border-0 shadow-sm p-4 rounded-4 bg-white mb-4">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
                <div class="d-flex align-items-center gap-3">
                    <img id="dash-user-avatar" src="" class="rounded-circle border border-2 border-success" width="65" height="65" alt="Avatar">
                    <div>
                        <span class="badge bg-success bg-opacity-10 text-success mb-1">Player Profile</span>
                        <h4 class="fw-bold text-secondary mb-0" id="dash-user-name">User Name</h4>
                        <small class="text-muted" id="dash-user-email">user@turfbook.com</small>
                    </div>
                </div>
                <div>
                    <a href="turfs.html" class="btn btn-primary-turf btn-sm">
                        <i class="bi bi-plus-circle me-1"></i>Book New Turf
                    </a>
                </div>
            </div>
        </div>

        <!-- 4 Overview KPI Cards -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm p-3 rounded-4 bg-white text-center">
                    <span class="text-muted small fw-bold">UPCOMING</span>
                    <h2 class="fw-extrabold text-primary mb-0" id="stat-upcoming-count">0</h2>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm p-3 rounded-4 bg-white text-center">
                    <span class="text-muted small fw-bold">COMPLETED</span>
                    <h2 class="fw-extrabold text-success mb-0" id="stat-completed-count">0</h2>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm p-3 rounded-4 bg-white text-center">
                    <span class="text-muted small fw-bold">FAVORITES</span>
                    <h2 class="fw-extrabold text-danger mb-0" id="stat-favorites-count">0</h2>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm p-3 rounded-4 bg-white text-center">
                    <span class="text-muted small fw-bold">TOTAL SPENT</span>
                    <h2 class="fw-extrabold text-secondary mb-0" id="stat-total-spent">₹0</h2>
                </div>
            </div>
        </div>

        <!-- Dashboard Navigation Tabs -->
        <div class="card border-0 shadow-sm rounded-4 bg-white p-3 mb-4">
            <ul class="nav nav-pills nav-fill gap-2" id="dashboardTabs" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active fw-semibold" id="tab-upcoming-btn" data-bs-toggle="pill" data-bs-target="#tab-upcoming">
                        <i class="bi bi-calendar-event me-2"></i>Upcoming Bookings
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link fw-semibold" id="tab-bookings-btn" data-bs-toggle="pill" data-bs-target="#tab-history">
                        <i class="bi bi-clock-history me-2"></i>Booking History
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link fw-semibold" id="tab-favorites-btn" data-bs-toggle="pill" data-bs-target="#tab-favorites">
                        <i class="bi bi-heart me-2"></i>My Favorites
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link fw-semibold" id="tab-profile-btn" data-bs-toggle="pill" data-bs-target="#tab-profile">
                        <i class="bi bi-person me-2"></i>Profile Settings
                    </button>
                </li>
            </ul>
        </div>

        <!-- Tab Content Panes -->
        <div class="tab-content" id="dashboardTabsContent">
            <!-- TAB 1: UPCOMING -->
            <div class="tab-pane fade show active" id="tab-upcoming">
                <div id="upcoming-bookings-container">
                    <!-- Populated by dashboard.js -->
                </div>
            </div>

            <!-- TAB 2: HISTORY -->
            <div class="tab-pane fade" id="tab-history">
                <div class="card border-0 shadow-sm rounded-4 p-3 bg-white" id="history-bookings-container">
                    <!-- Populated by dashboard.js -->
                </div>
            </div>

            <!-- TAB 3: FAVORITES -->
            <div class="tab-pane fade" id="tab-favorites">
                <div class="row" id="favorites-grid-container">
                    <!-- Populated by dashboard.js -->
                </div>
            </div>

            <!-- TAB 4: PROFILE SETTINGS -->
            <div class="tab-pane fade" id="tab-profile">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white max-w-lg">
                    <h5 class="fw-bold text-secondary mb-3">Update Profile Information</h5>
                    <form id="profile-edit-form">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Full Name</label>
                            <input type="text" id="profile-name-input" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Phone Number</label>
                            <input type="tel" id="profile-phone-input" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary-turf">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- TurfBook Scripts -->
    <script src="js/common.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/ai.js"></script>
</body>
</html>
